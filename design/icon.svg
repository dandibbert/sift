<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f8"/>
      <stop offset="0.55" stop-color="#c9c9cf"/>
      <stop offset="1" stop-color="#8e8e96"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3b4553"/>
      <stop offset="1" stop-color="#141519"/>
    </radialGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c46c"/>
      <stop offset="1" stop-color="#d98a2b"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>
  </g>

  <!-- Faint list rows behind the lens: what is being searched. -->
  <g fill="#ffffff" fill-opacity="0.07">
    <rect x="220" y="300" width="300" height="34" rx="17"/>
    <rect x="220" y="380" width="220" height="34" rx="17"/>
    <rect x="220" y="460" width="270" height="34" rx="17"/>
    <rect x="220" y="540" width="190" height="34" rx="17"/>
  </g>

  <g filter="url(#soft)">
    <path d="M622 622 L760 760" stroke="url(#handle)" stroke-width="92" stroke-linecap="round"/>
    <circle cx="470" cy="470" r="196" fill="url(#lens)"/>
    <circle cx="470" cy="470" r="196" fill="none" stroke="url(#rim)" stroke-width="54"/>
  </g>
  <!-- The rows again, magnified; one of them matched. -->
  <clipPath id="inside"><circle cx="470" cy="470" r="170"/></clipPath>
  <g clip-path="url(#inside)">
    <rect x="318" y="360" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="318" y="448" width="300" height="44" rx="22" fill="url(#handle)"/>
    <rect x="318" y="536" width="190" height="44" rx="22" fill="#ffffff" fill-opacity="0.16"/>
  </g>
  <path d="M352 362 A150 150 0 0 1 452 308" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="16" stroke-linecap="round"/>
</svg>
